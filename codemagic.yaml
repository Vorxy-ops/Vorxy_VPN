workflows:
  vorxy-vpn:
    name: Vorxy VPN Android
    max_build_duration: 60
    environment:
      flutter: 3.22.0
      android_sdk: 35
    scripts:
      - name: Clean build
        script: |
          rm -rf build
          rm -rf .dart_tool
          rm -rf android/.gradle
      - name: Install dependencies
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
