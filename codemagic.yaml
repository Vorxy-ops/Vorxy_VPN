workflows:
  vorxy-vpn:
    name: Vorxy VPN
    max_build_duration: 60
    environment:
      flutter: 3.22.0
    scripts:
      - name: Create missing files
        script: |
          mkdir -p android/app/src/main/kotlin/com/vorxy/vpn
          echo "package com.vorxy.vpn" > android/app/src/main/kotlin/com/vorxy/vpn/MainActivity.kt
          echo "import io.flutter.embedding.android.FlutterActivity" >> android/app/src/main/kotlin/com/vorxy/vpn/MainActivity.kt
          echo "class MainActivity: FlutterActivity()" >> android/app/src/main/kotlin/com/vorxy/vpn/MainActivity.kt
      - name: Clean build
        script: |
          rm -rf build
          rm -rf .dart_tool
          rm -rf android/.gradle
          rm -rf android/app/build
      - name: Install dependencies
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
