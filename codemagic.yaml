workflows:
  android-workflow:
    name: Android Build
    environment:
      flutter: 3.22.0
    scripts:
      - name: Clean everything
        script: |
          rm -rf build
          rm -rf .dart_tool
          rm -rf android/.gradle
          rm -rf android/app/build
      - name: Get dependencies
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
