workflows:
  vorxy-vpn:
    name: Vorxy VPN
    max_build_duration: 60
    environment:
      flutter: 3.22.3
      variables:
        JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
    scripts:
      - name: Create MainActivity
        script: |
          mkdir -p android/app/src/main/kotlin/com/vorxy/vpn
          cat > android/app/src/main/kotlin/com/vorxy/vpn/MainActivity.kt << 'EOF'
          package com.vorxy.vpn
          import io.flutter.embedding.android.FlutterActivity
          class MainActivity: FlutterActivity()
          EOF
      - name: Clean everything
        script: |
          rm -rf build
          rm -rf .dart_tool
          rm -rf android/.gradle
          rm -rf android/app/build
      - name: Install dependencies
        script: |
          flutter clean
          flutter pub get
      - name: Build APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          cd ..
          flutter build apk --release --no-pub
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
    publishing:
      email:
        recipients:
          - your-email@example.com
